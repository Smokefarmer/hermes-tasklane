# TaskLane configuration.
# Copy to $TASKLANE_HOME/config.yaml (default ~/.tasklane/config.yaml) and keep it mode 600.
# If the file is absent on first run, TaskLane writes one automatically with a random app_token.

# --- worker ---
poll_interval_seconds: 5.0
max_in_progress: 1
default_model: null                 # null = use the claude CLI default model
permission_mode: bypassPermissions  # required so headless jobs can run git commit/push
timeout_seconds: 3600
repos_allowlist: []                 # [] = any path allowed; list absolute path prefixes to restrict (recommended for remote use)

# --- reliability ---
max_attempts: 3                     # total claims per job; transient failures auto-retry until this cap, then park in blocked
retry_backoff_seconds: 60.0         # auto-retry delay = base * 2^(attempt-1)
stale_lock_seconds: 900.0           # claim locks older than this are removed (debris from a killed process)
reconcile_interval_seconds: 60.0    # worker recovers orphaned running jobs / stale locks on this cadence

# --- observability / cost control ---
daily_budget_usd: 0.0               # pause claiming new jobs once 24h spend reaches this; 0 = unlimited

# --- MCP control plane ---
mcp_host: "127.0.0.1"               # bind localhost only; expose via a tunnel, not directly
mcp_port: 8788
app_token: ""                       # bearer token every client must send; auto-generated on first run
public_hostnames: []                # e.g. [tasklane.example.com] — required when fronted by a reverse proxy / tunnel
allowed_origins: []                 # extra browser Origins to accept (usually empty)
enable_admin_exec: false            # server-level shell tool, OFF by default
exec_timeout_seconds: 600
pairing_enabled: true               # let new clients request access via POST /pair (each request still needs operator approval); false disables the endpoint and paired-token auth

# --- project registry (for TESTER roles) ---
# Per-project test/deploy profiles, keyed by the job's `project` name. A tester job
# (role test-local / test-staging, or the optional pipeline `test` stage) uses these.
# SECURITY: env_file is the ONLY place secrets live. The worker loads it (refusing it
# unless mode 600 and owned by you) and injects the values into the claude subprocess;
# the prompt only ever receives the KEY NAMES, never the values.
# A `repo:` path binds the conversational intake tools (set_project_secrets /
# list_project_secret_keys / delete_project_secret) to this project. The first
# set_project_secrets call auto-creates ~/.tasklane/secrets/<project>.env (dir 700,
# file 600) and fills in `env_file` below — so secrets need not be hand-edited here.
projects: {}
#   acme:
#     repo: /home/me/dev/acme                         # binds intake tools to this project
#     env_file: /home/me/.secrets/acme.staging.env    # mode 600, owned by you, KEY=VALUE lines
#     local_test_command: "npm run dev"
#     staging_url: "https://staging.acme.example.com"
#     staging_url_command: "railway domain --json"    # run to discover the URL
#     test_notes: "Seeded test tenant only; never touch tenant prod-*."
