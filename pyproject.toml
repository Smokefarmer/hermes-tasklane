[project]
name = "tasklane"
version = "0.1.0"
description = "Standalone autonomous coding-job control plane — runs claude -p in isolated git worktrees, driven remotely over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
    "uvicorn>=0.27",
]

[project.scripts]
tasklane = "tasklane.cli:main"
tasklane-worker = "tasklane.worker:main"
tasklane-mcp = "tasklane.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests (real worker/MCP server, fake claude CLI)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["tasklane", "tasklane.prompts"]

[tool.setuptools.package-data]
"tasklane.prompts" = ["*.md"]
