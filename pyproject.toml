[project]
name = "tasklane"
version = "0.1.0"
description = "Standalone autonomous coding-job control plane — runs claude -p in isolated git worktrees, driven remotely over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
    "uvicorn>=0.27",
]

[project.scripts]
tasklane = "tasklane.cli:main"
tasklane-worker = "tasklane.worker:main"
tasklane-mcp = "tasklane.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tasklane"]
